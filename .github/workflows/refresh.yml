name: Refresh data

# Every weekday at 10:00 London time. GitHub cron runs in UTC, so it fires at 09:00 and
# 10:00 UTC (10:00 London in summer and winter respectively) plus an 11:00 UTC backup in case
# a run is delayed or a source fails; the first step skips runs before 10:00 London or after
# every step has already succeeded that day.
on:
  schedule:
    - cron: "0 9,10,11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check London time
        id: gate
        run: |
          hour=$(TZ=Europe/London date +%H)
          today=$(TZ=Europe/London date +%Y-%m-%d)
          # Only "done" once every step succeeded today, so the backup run retries failed sources.
          done=$(python3 -c "import json;m=json.load(open('data/meta.json'));print(m.get('refreshed','')[:10] if all(s['ok'] for s in m['steps'].values()) else '')" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$hour" -ge 10 ] && [ "$done" != "$today" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: London hour $hour, last refresh $done"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Refresh
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r scripts/requirements.txt
          python scripts/refresh.py

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(TZ=Europe/London date +'%Y-%m-%d %H:%M')"
          git push

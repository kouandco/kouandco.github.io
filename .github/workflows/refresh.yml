name: Refresh data

# Three refreshes every weekday, London time:
#   10:00  morning: DTCC's file of the previous day (complete after midnight New York), overnight fixings
#          (€STR, SONIA, SOFR / EFFR), and a retry of anything the evening runs missed
#   19:00  evening: European closes (Borsa Italiana OATs and BTPs, Bundesbank Bunds), Eurex trade files
#   23:30  night: US closes (TreasuryDirect FedInvest, Treasury par curve) and the Eurex Clearing curves
# GitHub cron runs in UTC, so each slot has a cron for summer (UTC+1) and winter (UTC) plus backups in
# case a run is delayed or a source fails. The first step works out the slot from the London time and
# skips the run if the slot already succeeded in full today (data/meta.json "slots").
on:
  schedule:
    - cron: "0 9,10,11 * * 1-5"     # morning: 10:00 London, backups
    - cron: "0 18,19,20 * * 1-5"    # evening: 19:00 London, backups
    - cron: "30 22,23 * * 1-5"      # night: 23:30 London (summer 22:30 UTC, winter 23:30 UTC), backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the refresh slot
        id: gate
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/London"))
          h = now.hour
          day = (now - timedelta(days=1) if h < 2 else now).date()   # a late night run belongs to the evening before
          slot = "morning" if 10 <= h < 15 else "evening" if 19 <= h < 23 else "night" if h >= 23 or h < 2 else None
          try:
              done = json.load(open("data/meta.json")).get("slots", {}).get(slot)
          except Exception:
              done = None
          manual = os.environ["MANUAL"] == "true"
          run = manual or (slot is not None and done != str(day))
          print(f"London {now:%H:%M}, slot {slot}, last full success {done}: {'run' if run else 'skip'}", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          print(f"slot={slot or 'manual'}")
          print(f"day={day}")
          EOF

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Refresh
        if: steps.gate.outputs.run == 'true'
        env:
          REFRESH_SLOT: ${{ steps.gate.outputs.slot }}
          REFRESH_DAY: ${{ steps.gate.outputs.day }}
        run: |
          pip install -r scripts/requirements.txt
          python scripts/refresh.py

      - name: Commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh data $(TZ=Europe/London date +'%Y-%m-%d %H:%M') (${{ steps.gate.outputs.slot }})"
          git push
